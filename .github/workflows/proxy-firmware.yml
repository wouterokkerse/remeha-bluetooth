name: Elga proxy firmware

on:
  push:
    branches: [master]
    paths: ["esphome/**", "docs/**", ".github/workflows/proxy-firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build firmware
        id: esphome
        uses: esphome/build-action@v7
        with:
          yaml-file: esphome/elga-proxy.yaml
          version: 2026.10.2
      - name: Assemble installer site
        run: |
          mkdir -p site/firmware
          cp docs/index.html site/
          cp -r "${{ steps.esphome.outputs.name }}"/* site/firmware/
          # ESP Web Tools needs name/version/builds[]; build-action writes a single build.
          jq '{name: "Elga Bluetooth Proxy", version: "0.4.0",
               new_install_prompt_erase: true,
               builds: [{chipFamily: .chipFamily, parts: .parts}]}' \
            "${{ steps.esphome.outputs.name }}/manifest.json" > site/firmware/manifest.json
          cat site/firmware/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
