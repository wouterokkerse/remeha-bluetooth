# Lets Home Assistant hand the Elga PIN to this proxy for a two-minute,
# MAC-bound pairing window. Nothing is stored on the device.
esphome:
  min_version: 2026.10.2

external_components:
  - source:
      type: git
      url: https://github.com/wouterokkerse/remeha-bluetooth
      ref: main
      path: esphome/elga-ace-components
    components: [elga_ace_pairing]

esp32_ble:
  io_capability: keyboard_only

elga_ace_pairing:
  id: elga_pairing

api:
  actions:
    - action: elga_ace_set_pairing_code
      variables:
        address: string
        pin: string
      then:
        - lambda: |-
            id(elga_pairing).set_pairing_code(address, pin);
